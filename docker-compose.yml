services:
  postgres:
    image: postgres:16-alpine
    container_name: cbt-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cbt_dev_2024
      POSTGRES_DB: cbt_portal
    volumes:
      - cbt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  cbt_postgres_data:

networks:
  default:
    name: cbt-network
