# =====================================================
# Portal CBT — nginx config
# Servidor estatico para Vite SPA com fallback de rotas.
# Roda dentro do container nginx:alpine.
# =====================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressao Gzip (reduz JS/CSS/HTML em ~70%)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # Headers de seguranca basicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets com hash no nome (vite gera /assets/index-AbCd1234.js):
    # cache de 1 ano. Se mudar o conteudo, o hash muda e o nome novo
    # eh requisitado naturalmente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Outras rotas estaticas (favicon, branding, robots, etc.) — cache curto
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html nunca cacheia — garante que UI atualiza ao redeploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota nao-estatica retorna o index.html
    # para o React Router resolver no client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check trivial (usado pelo HEALTHCHECK do Dockerfile)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
